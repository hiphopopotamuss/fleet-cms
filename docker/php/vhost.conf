<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Source, config, and vendor must never be web-accessible.
    <Directory /var/www/html/src>
        Require all denied
    </Directory>
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/views>
        Require all denied
    </Directory>
</VirtualHost>
